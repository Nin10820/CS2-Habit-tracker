<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Habit Tracker</title>
    <meta name="description" content="A small daily habit tracker: check in, keep streaks, see your week and month. Data stays on your device. Early v0.1 by Pham Nguyen Studio." />
    <meta name="theme-color" content="#f5f5f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1113" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Montserrat:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint so there's no flash.
      try {
        var t = localStorage.getItem("habit-tracker:theme")
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
